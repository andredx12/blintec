services:
  postgres:
    image: postgres:16
    container_name: blintec-postgres
    environment:
      POSTGRES_DB: blintec
      POSTGRES_USER: blintec
      POSTGRES_PASSWORD: blintec123
    ports:
      - "5433:5432"
    volumes:
      - blintec-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U blintec"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: blintec-backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/blintec
      SPRING_DATASOURCE_USERNAME: blintec
      SPRING_DATASOURCE_PASSWORD: blintec123
    ports:
      - "8081:8081"

  frontend:
    build: ../blintec-frontend
    container_name: blintec-frontend
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  blintec-data: